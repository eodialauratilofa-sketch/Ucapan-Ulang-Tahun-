<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY!!</title>

<style>
* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffd6e7,#ffeaf4);
display:flex;
justify-content:center;
align-items:center;
}

.scene{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:100%;

display:flex;
justify-content:center;
align-items:center;

padding:20px;
transition:.6s ease;
}

.hidden{
display:none;
}

.card{
background:rgba(255,255,255,.25);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,.1);
width:90%;
max-width:600px;
margin:auto;
z-index:10;
position:relative;
display:flex;
flex-direction:column;
gap:12px;
align-items:center;
text-align:center;
}

h1{
color:#ff4f8b;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
color:#444;

}

button{
margin:10px;
padding:12px 25px;
border:none;
border-radius:25px;
background:#ff6fa5;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

#noBtn{
transition:
left .35s ease,
top .35s ease,
transform .2s ease;
}

button:hover{
transform:scale(1.05);
}

.flower{
position:fixed;
font-size:25px;
pointer-events:none;
z-index:-999;
}

.star{
position:fixed;
color:white;
pointer-events:none;
z-index:1;

}
@keyframes blink{
50%{
opacity:0;
}
}

.confetti{
position:fixed;
font-size:25px;
pointer-events:none;
animation:fall 4s linear forwards;
z-index:999;
}
@keyframes fall{
from{
transform:translateY(-100px);
}
to{
transform:translateY(100vh);
}
}

#message{
font-size:20px;
color:#ff4f8b;
height:30px;
font-weight:bold;
transition:.3s;
}

.hidden{
    display:none;
}
.blurText{
    animation:blurReveal 1.5s ease forwards;
}
@keyframes blurReveal{
    0%{
        opacity:0;
        filter:blur(15px);
        transform:scale(1.2);
    }

    100%{
        opacity:1;
        filter:blur(0);
        transform:scale(1);
    }

}

.boomText{
    animation:boom 1.5s ease-out;
}
@keyframes boom{
    0%{
        transform:scale(0);
        opacity:0;
    }

    60%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.typingText{
max-width:500px;
margin:auto;
white-space:normal;
word-break:break-word;
line-height:1.7;
}

.hidden{
  display:none;
}

.buttonGroup{
  display:flex;
  flex-direction:row;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.bigButton{
padding:15px 30px;
border-radius:30px;
background:linear-gradient(45deg,#ff4f8b,#ff8fc7);
color:white;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.bigButton:hover{
transform:scale(1.1);
box-shadow:0 0 20px rgba(255,79,139,.6);
}

.fadeIn{
animation:fade 1s ease forwards;
}
@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}
</style>

</head>

<body>

<!-- SCENE 0 - OPENING -->
<div id="scene0" class="scene">
  <div class="card">
    <h2 class="fadeIn">🩷</h2>
<audio id="bgMusic" loop>
    <source src="Monokrom.mp3" type="audio/mpeg">
</audio>
 <button class="bigButton fadeIn" onclick="startExperience()">
    Masuk
</button>
</div>
</div>

<!-- SCENE 1 - OPENING -->
<div id="scene1" class="scene hidden">
  <div class="card">
    <h2 class="boomText">Haiii 👀</h2>
   <button class="bigButton fadeIn" onclick="nextScene(2)">
    Mulai
</button>
  </div>
</div>

<!-- SCENE 2 -->
<div id="scene2" class="scene hidden">
  <div class="card">
     <h2 class="blurText">Ada sesuatu nih buat u ☺️</h2>
     <p class="typingText"
data-text="🗣️ Buat aku??">
</p>
    <button class="bigButton fadeIn" onclick="nextScene(3)">Lanjut</button>
  </div>
</div>

<!-- SCENE 3 -->
<div id="scene3" class="scene hidden">
  <div class="card">
    <h2 class="blurText">Iyaa buat u 🫵🏻</h2>
    <button class="bigButton fadeIn" onclick="nextScene(4)">Lanjut</button>
  </div>
</div>


<!-- SCENE 4 -->
<div id="scene4" class="scene hidden">

    <h2 class="blurText">Emm...🤔</h2>

<p class="typingText"
data-text="Hari ini rasanya spesial banget lohh, tau ga kenapa??">
</p>

<p id="message"></p>

    <div class="buttonGroup">
      <button class="bigButton fadeIn" onclick="nextScene(5)">
        Karena aku
      </button>

      <button class="bigButton fadeIn" id="noBtn" onclick="moveButton()">
        Karena Orang
      </button>
    </div>

  </div>
</div>

<!-- SCENE 5 -->
<div id="scene5" class="scene hidden">
  <div class="card">

<h2 class="blurText">Nah gituu dong jujur 😋</h2>

    <button class="bigButton fadeIn" onclick="nextScene(6)">Lanjut</button>
  </div>
</div>

<!-- SCENE 6 -->
<div id="scene6" class="scene hidden">
  <div class="card">
    <h2 class="boomText">BOOMMM 💥💥💥</h2>

    <!-- FOTO CILL -->
    <img class="boomText" src="img.jpeg" style="width:100%;border-radius:15px;margin:10px 0;">
    <h2 class="fadeIn">📸</h2>
   <p class="typingText"
data-text="Happy birthday 🎂">
</p>
    <button class="bigButton fadeIn" onclick="nextScene(7)">Lanjut</button>
  </div>
</div>


<!-- SCENE 7 -->
<div id="scene7" class="scene hidden">

    <h2 class="blurText">🎂🎂🎂</h2>
   <p class="typingText"

    <button class="bigButton fadeIn" onclick="nextScene(8)">Lanjut</button>

<!-- SCENE 8 -->
<div id="scene8" class="scene hidden">
  <div class="card">
    <h2 class="boomText">🙏🏻🙏🏻</h2>
    <p class="typingText"
data-text="Bersyandahh bersyandahhh 🫰🏻🫰🏻 jann mayahh yaaa 😊">
</p>
    
    <button class="bigButton fadeIn" onclick="nextScene(9)">Lanjut</button>
  </div>
</div>

<!-- SCENE 9 -->
<div id="scene9" class="scene hidden">
  <div class="card">
    <h3 class="blurText">💌</h3>
  <p class="typingText"
data-text="Panjang umur, sehat selalu yaa 🩷 jann sering-sering sedih, u harus bahagia selalu 🤗 serta semoga selalu di kelilingi orang-orang baik yaa 🫂🩷">
</p>
    <button class="bigButton fadeIn" onclick="nextScene(10)">Lanjut</button>
  </div>
</div>

<!-- SCENE 10 -->

<div id="scene10" class="scene hidden">
  <div class="card">
    <h2 class="fadeIn">️✨</h2>
    <p class="typingText"
data-text="Semangat sekolahh nyaa, jann seringg buat masalah yakk!!" >
</p>
    
    <button class="bigButton fadeIn" onclick="nextScene(11)">Lanjut</button>
  </div>
</div>

<!-- SCENE 11 - ENDING -->
<div id="scene11" class="scene hidden">
  <div class="card">
    <h2 class="blurText">Lovee u 🫂🩷</h2>
     <img class="fadeIn" src="IMG.jpg" style="width:100%;border-radius:3px;margin:4px 0;">
    
     <button class="bigButton blurText" onclick="flowerBoom()">
    💐
</button>
  </div>
</div>

<script>
let currentScene = 0;

function nextScene(num){

document.querySelectorAll(".scene")
.forEach(s=>s.classList.add("hidden"));

document.getElementById("scene"+num)
.classList.remove("hidden");
}

function startExperience(){

    document.getElementById("bgMusic").play();

    nextScene(1);

}

function startTyping(scene){

  let target =
  scene.querySelector(".typingText");

  if(!target) return;

  let text = target.dataset.text;

  target.innerHTML = "";

  let i = 0;

  function typing(){

    if(i < text.length){

      target.innerHTML += text[i];

      i++;

      setTimeout(typing,50);

    }

  }

  setTimeout(typing,1600);

}

function nextScene(num){

  document.querySelectorAll(".scene")
  .forEach(s => s.classList.add("hidden"));

  const scene =
  document.getElementById("scene"+num);

  scene.classList.remove("hidden");

  startTyping(scene);

}

const messages = [
  "Yakin?? 🤨",
  "Beneran?? 😏",
  "Jangan bohong deh 😌"
];

let count = 0;

function moveButton(){

    let currentMessage = count;

    document.getElementById("message").style.opacity = "0";

    setTimeout(() => {

        document.getElementById("message").innerText =
        messages[currentMessage];

        document.getElementById("message").style.opacity = "1";

    },150);

    count++;

    if(count >= 3){
        noBtn.style.display = "none";
    }

    let pos = getRandomPosition();

    noBtn.style.position = "fixed";
    noBtn.style.left = pos.x + "px";
    noBtn.style.top = pos.y + "px";
}

function isOverlapping(x,y,btnWidth,btnHeight,cardRect){

    return !(
        x + btnWidth < cardRect.left ||
        x > cardRect.right ||
        y + btnHeight < cardRect.top ||
        y > cardRect.bottom
    );
}

function getRandomPosition(){

    const btnRect = noBtn.getBoundingClientRect();

    const btnWidth = btnRect.width;
    const btnHeight = btnRect.height;

    let x =
      Math.random() * (window.innerWidth - btnWidth - 25);

    let y =
      Math.random() * (window.innerHeight - btnHeight - 25);

    return {x,y};
}

function flowerBoom(){

    const flowers = ["🌸","🌷","🩷"];

    for(let i=0;i<45;i++){

        let flower = document.createElement("div");

        flower.className = "flower";
        flower.innerText =
        flowers[Math.floor(Math.random()*flowers.length)];

        flower.style.position = "fixed";
        flower.style.left = "50%";
        flower.style.top = "50%";

        flower.style.fontSize =
        (15 + Math.random()*20) + "px";

        document.body.appendChild(flower);

        let angle = Math.random()*360;
        let distance = 250 + Math.random()*500;

        flower.animate(
        [
            {
                transform:"translate(0,0) scale(0.3)",
                opacity:0
            },
            {
                transform:"translate(0,0) scale(1)",
                opacity:1,
                offset:0.1
            },
            {
                transform:`translate(
                ${Math.cos(angle*Math.PI/180)*distance}px,
                ${Math.sin(angle*Math.PI/180)*distance}px
                ) scale(1.3)`,
                opacity:1
            },
            {
                transform:`translate(
                ${Math.cos(angle*Math.PI/180)*distance}px,
                ${Math.sin(angle*Math.PI/180)*distance}px
                ) scale(1.3)`,
                opacity:0
            }
        ],
        {
            duration:3500,
            easing:"ease-out",
            fill:"forwards"
        });

        setTimeout(()=>{
            flower.remove();
        },3500);
    }
}

const noBtn=document.getElementById("noBtn");
</script>
</body>
</html>
